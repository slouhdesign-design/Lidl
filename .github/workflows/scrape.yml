name: Scrape Lidl prices

on:
  workflow_dispatch:       # lets you click "Run workflow" manually
  schedule:
    - cron: "0 6 * * *"    # every day at 06:00 UTC

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run scraper
        run: python scraper.py

      - name: Upload debug artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debug-output
          path: debug/

      - name: Commit updated data.json
        run: |
          git config user.name "lidl-dashboard-bot"
          git config user.email "actions@github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update prices"
          git push
